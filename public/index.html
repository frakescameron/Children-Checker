<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rock Church Kids Check-In</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1e2a4a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-title">🏠 Rock Church Kids Check-In</div>
  <nav class="topbar-nav">
    <button class="nav-btn active" data-view="hub">Hub</button>
    <button class="nav-btn" data-view="checkin">Check In</button>
    <button class="nav-btn" data-view="roster">Manage Kids</button>
  </nav>
  <div class="conn-status" id="connStatus">●</div>
</header>

<div id="offlineBanner" class="offline-banner" style="display:none;">
  ⚠️ Can't reach the host tablet. Make sure it's turned on and connected to wifi — this will reconnect automatically.
</div>

<main id="app"></main>

<!-- Modal container -->
<div id="modalRoot"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
